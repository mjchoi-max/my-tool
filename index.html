<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가정방문 기록 도구</title>
  <style>
    :root {
      --primary-color: #1a56db;
      --primary-hover: #1e429f;
      --success-color: #0e9f6e;
      --success-hover: #057a55;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-color: #1e293b;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 30px 20px;
      font-size: 18px;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    /* 상단 요약 카드 영역 */
    .summary-bar {
      display: flex;
      justify-content: space-around;
      background-color: #f1f5f9;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      border: 1px solid #e2e8f0;
    }

    .summary-item {
      text-align: center;
    }

    .summary-label {
      font-size: 16px;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .summary-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary-color);
    }

    .summary-value.today {
      color: #d97706; /* 오늘 건수는 주황색으로 강조 */
    }

    h1 {
      font-size: 28px;
      color: #0f172a;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 3px solid #e2e8f0;
      text-align: center;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      font-size: 20px;
      color: #334155;
    }

    input[type="date"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 14px 16px;
      font-size: 18px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      background-color: #fff;
      color: var(--text-color);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="date"]:focus,
    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 4px rgba(26, 86, 219, 0.15);
    }

    textarea {
      height: 120px;
      resize: vertical;
    }

    .btn-container {
      display: flex;
      gap: 15px;
      margin-top: 25px;
      margin-bottom: 35px;
    }

    button {
      flex: 1;
      padding: 16px 24px;
      font-size: 20px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-save {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-save:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-excel {
      background-color: var(--success-color);
      color: white;
    }

    .btn-excel:hover {
      background-color: var(--success-hover);
      transform: translateY(-1px);
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-top: 20px;
      border-top: 2px dashed #e2e8f0;
    }

    .list-title {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      background-color: white;
    }

    th {
      background-color: #f1f5f9;
      color: #334155;
      font-weight: 700;
      padding: 14px 16px;
      font-size: 18px;
      border-bottom: 2px solid var(--border-color);
      white-space: nowrap;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 17px;
      vertical-align: top;
    }

    tr:nth-child(even) {
      background-color: #f8fafc;
    }

    tr:hover {
      background-color: #f1f5f9;
    }

    .empty-msg {
      text-align: center;
      color: #94a3b8;
      padding: 30px;
      font-size: 18px;
    }

    @media (max-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      .btn-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📋 가정방문 기록 도구</h1>

  <!-- 상단 건수 요약 영역 추가 -->
  <div class="summary-bar">
    <div class="summary-item">
      <div class="summary-label">📅 오늘 방문 건수</div>
      <div class="summary-value today"><span id="todayCount">0</span>건</div>
    </div>
    <div class="summary-item">
      <div class="summary-label">📂 전체 기록 건수</div>
      <div class="summary-value"><span id="totalCount">0</span>건</div>
    </div>
  </div>
  
  <form id="visitForm">
    <div class="form-grid">
      <div class="form-group">
        <label for="visitDate">방문일</label>
        <input type="date" id="visitDate" required>
      </div>

      <div class="form-group">
        <label for="targetName">대상자 이름</label>
        <input type="text" id="targetName" placeholder="성함을 입력하세요" required>
      </div>
    </div>

    <div class="form-group">
      <label for="visitPurpose">방문 목적</label>
      <input type="text" id="visitPurpose" placeholder="예: 정기 안부 확인, 생활실태 조사" required>
    </div>

    <div class="form-group">
      <label for="remarks">특이사항</label>
      <textarea id="remarks" placeholder="상담 내역 및 특이사항을 작성하세요"></textarea>
    </div>

    <div class="btn-container">
      <button type="submit" class="btn-save">💾 저장하기</button>
      <button type="button" class="btn-excel" onclick="downloadCSV()">📥 엑셀(CSV) 다운로드</button>
    </div>
  </form>

  <div class="list-header">
    <div class="list-title">방문 기록 목록</div>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width: 15%;">방문일</th>
          <th style="width: 18%;">대상자 이름</th>
          <th style="width: 27%;">방문 목적</th>
          <th style="width: 40%;">특이사항</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="4" class="empty-msg">등록된 방문 기록이 없습니다.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 오늘 날짜 가져오기 (YYYY-MM-DD)
  const getTodayString = () => new Date().toISOString().substring(0, 10);

  // 오늘 날짜 기본 세팅
  document.getElementById('visitDate').value = getTodayString();

  // 방문 기록 데이터 배열
  const records = [];

  // 폼 제출 이벤트
  document.getElementById('visitForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const visitDate = document.getElementById('visitDate').value;
    const targetName = document.getElementById('targetName').value.trim();
    const visitPurpose = document.getElementById('visitPurpose').value.trim();
    const remarks = document.getElementById('remarks').value.trim();

    // 데이터 추가
    records.push({
      date: visitDate,
      name: targetName,
      purpose: visitPurpose,
      remarks: remarks
    });

    // 목록 업데이트 및 폼 초기화
    renderTable();
    
    // 입력창 초기화
    document.getElementById('targetName').value = '';
    document.getElementById('visitPurpose').value = '';
    document.getElementById('remarks').value = '';
    
    document.getElementById('targetName').focus();
  });

  // 테이블 및 상단 건수 카운트 업데이트 함수
  function renderTable() {
    const tbody = document.getElementById('tableBody');
    const totalCountSpan = document.getElementById('totalCount');
    const todayCountSpan = document.getElementById('todayCount');

    // 1. 전체 건수 업데이트
    totalCountSpan.textContent = records.length;

    // 2. 오늘 방문 건수 계산 (방문일이 오늘 날짜인 항목만 필터링)
    const todayStr = getTodayString();
    const todayRecords = records.filter(item => item.date === todayStr);
    todayCountSpan.textContent = todayRecords.length;

    if (records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" class="empty-msg">등록된 방문 기록이 없습니다.</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    records.forEach(function(item) {
      const tr = document.createElement('tr');
      const formattedRemarks = escapeHtml(item.remarks).replace(/\n/g, '<br>');
      
      tr.innerHTML = `
        <td>${escapeHtml(item.date)}</td>
        <td><strong>${escapeHtml(item.name)}</strong></td>
        <td>${escapeHtml(item.purpose)}</td>
        <td>${formattedRemarks}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  // 특수문자 변환 (보안)
  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // 엑셀(CSV) 다운로드 함수
  function downloadCSV() {
    if (records.length === 0) {
      alert('다운로드할 방문 기록이 없습니다. 먼저 기록을 작성 후 저장해 주세요.');
      return;
    }

    let csvContent = '\uFEFF';
    csvContent += '방문일,대상자 이름,방문 목적,특이사항\n';

    records.forEach(function(item) {
      const row = [
        `"${item.date}"`,
        `"${item.name.replace(/"/g, '""')}"`,
        `"${item.purpose.replace(/"/g, '""')}"`,
        `"${item.remarks.replace(/"/g, '""')}"`
      ];
      csvContent += row.join(',') + '\n';
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const today = getTodayString();
    
    link.setAttribute('href', url);
    link.setAttribute('download', `가정방문기록_${today}.csv`);
    
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>

</body>
</html>
